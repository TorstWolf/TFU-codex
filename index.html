<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFU Codex</title>
<meta name="description" content="The codex of Torstwolfs Fictional Universe: continents, factions, nations and characters.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=Barlow+Condensed:wght@600;700&family=Rajdhani:wght@600;700&family=Marcellus&family=Outfit:wght@600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="codex.css">
</head>
<body>
<header class="top">
  <button id="treeBtn" class="icon-btn tree-btn" aria-label="Show index" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" id="brand" href="#/"></a>
  <div class="search">
    <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search the codex" autocomplete="off" aria-label="Search the codex">
    <kbd>/</kbd>
    <ul id="results" class="results" hidden></ul>
  </div>
  <button id="themeBtn" class="icon-btn" aria-label="Toggle light or dark mode" title="Light / dark">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" fill="currentColor"/></svg>
  </button>
  <a class="back" id="back" hidden></a>
</header>
<div class="layout">
  <aside id="tree" class="tree" aria-label="Codex index"></aside>
  <div id="scrim" class="scrim" hidden></div>
  <main id="view" class="view"></main>
</div>
<div id="lightbox" class="lightbox" hidden><img alt=""></div>
<script src="lore.js"></script>
<script src="codex.js"></script>
</body>
</html>
